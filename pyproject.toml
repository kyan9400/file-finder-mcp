[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "file-finder-mcp"
version = "1.0.0"
description = "Bounded, ranked local file discovery for MCP clients."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Hassan Ak" }]
keywords = ["mcp", "filesystem", "search", "developer-tools"]
dependencies = ["mcp>=2,<3", "pydantic>=2.12,<3"]

[project.optional-dependencies]
dev = ["build>=1.3,<2", "pytest>=8.4,<10", "ruff>=0.12,<1"]

[project.scripts]
file-finder = "file_finder.cli:main"
file-finder-mcp = "file_finder.server:main"

[project.urls]
Homepage = "https://github.com/kyan9400/file-finder-mcp"
Issues = "https://github.com/kyan9400/file-finder-mcp/issues"
Source = "https://github.com/kyan9400/file-finder-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/file_finder"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

